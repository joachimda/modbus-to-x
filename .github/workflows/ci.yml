name: CI

# Only the firmware project under software/ and this workflow feed the build
# and the tests. Hardware sources, the root docs and the configuration
# examples skip CI entirely.
#
# The ruleset on main does not require these checks, so a skipped workflow
# does not block a merge. If required status checks are ever added, move the
# filtering to job-level `if:` conditions instead: a skipped job counts as
# passing, while a workflow filtered out by `paths` never reports at all.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "software/**"
      - "!software/**/*.md"
      - "!software/modbus-to-mqtt/docs/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [ "main" ]
    paths:
      - "software/**"
      - "!software/**/*.md"
      - "!software/modbus-to-mqtt/docs/**"
      - ".github/workflows/ci.yml"

env:
  PROJECT_DIR: software/modbus-to-mqtt

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: mbx-custom-board-dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ${{ env.PROJECT_DIR }}/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles(format('{0}/platformio.ini', env.PROJECT_DIR), format('{0}/platformio.lock', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build firmware
        run: pio run --project-dir "${PROJECT_DIR}" -e "${PIO_ENV}"

      - name: Build filesystem
        run: pio run --project-dir "${PROJECT_DIR}" -e "${PIO_ENV}" -t buildfs

  # Host-side Unity tests (test/sample_test.cpp) built with the native platform.
  native-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      # Separate key from the build job: this cache holds the native toolchain
      # and ArduinoFake rather than the ESP32 platform.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ${{ env.PROJECT_DIR }}/.pio
          key: ${{ runner.os }}-pio-native-${{ hashFiles(format('{0}/platformio.ini', env.PROJECT_DIR), format('{0}/platformio.lock', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Run native unit tests
        run: pio test --project-dir "${PROJECT_DIR}" -e native-test

  # Node tests for the web UI modules under data/js. One test starts
  # scripts/run_test_webserver.py (stdlib only) with the runner's python3.
  web-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run web UI tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: node --test test/web/*.test.mjs
