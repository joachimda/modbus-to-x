[platformio]
default_envs = mbx-custom-board-dev
boards_dir = boards

[common]
lib_deps =
	4-20ma/ModbusMaster@^2.0.1
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson @ ^7.4.3
	esp32async/ESPAsyncWebServer@^3.12.0

[env]
[env:native-test]
platform = native@^1.2.1
test_framework = unity
build_flags =
	-std=gnu++17
	-I test/stubs
build_unflags = -std=gnu++11
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
	bblanchon/ArduinoJson @ ^7.4.3

[env:mbx-custom-board-dev]
framework = arduino
platform = espressif32
extends = common
board = mbx_custom_board
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = mbx_partitions.csv
board_build.filesystem = spiffs
build_flags =
	-DCORE_DEBUG_LEVEL=5
extra_scripts =
	pre:scripts/install_build_deps.py

# The OTA environments take the target device from the environment so that no
# local address or password is committed:
#   MBX_DEV_OTA_HOST      device IP or hostname (upload_port)
#   MBX_DEV_OTA_PASSWORD  ArduinoOTA password (compiled in and used for upload)
[env:mbx-custom-board-dev-ota]
framework = arduino
platform = espressif32
extends = common
board = mbx_custom_board
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = mbx_partitions.csv
board_build.filesystem = spiffs
upload_protocol = espota
upload_port = ${sysenv.MBX_DEV_OTA_HOST}
upload_flags =
	--auth=${sysenv.MBX_DEV_OTA_PASSWORD}
	--host_port=50000
build_flags =
	-D DEV_OTA_ENABLED=1
	-D DEV_OTA_ARDUINO_PASS="\"${sysenv.MBX_DEV_OTA_PASSWORD}\""
	-DCORE_DEBUG_LEVEL=5
extra_scripts =
	pre:scripts/install_build_deps.py

# Used for preparing an existing development device for receiving OTA updates via HTTP
[env:mbx-custom-board-release-primer]
framework = arduino
platform = espressif32
extends = common
board = mbx_custom_board
monitor_speed = 115200
board_build.partitions = mbx_partitions.csv
board_build.filesystem = spiffs
upload_protocol = espota
upload_port = ${sysenv.MBX_DEV_OTA_HOST}
upload_flags =
	--auth=${sysenv.MBX_DEV_OTA_PASSWORD}
	--host_port=50000
build_flags =
	-D FW_Version=0.0.0
	-D DEV_OTA_ENABLED=1
	-D DEV_OTA_ARDUINO_PASS="\"${sysenv.MBX_DEV_OTA_PASSWORD}\""
extra_scripts =
	pre:scripts/install_build_deps.py

# Used when releasing HTTP OTA updates
[env:mbx-custom-board-release]
framework = arduino
platform = espressif32
extends = common
board = mbx_custom_board
monitor_speed = 115200
board_build.partitions = mbx_partitions.csv
board_build.filesystem = spiffs
extra_scripts =
	pre:scripts/install_build_deps.py
	pre:scripts/gen_version.py
